<style>
:root{--bg:#f5f0fb;--card:#fff;--p:#7c4dff;--t:#2b2b2b;--m:#888;--blue:#3b82f6;--red:#ef4444;--line:#e9e2f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
body{padding:0 12px calc(24px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.tabs{position:sticky;top:0;z-index:5;display:flex;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px}
.tabs button{flex:1;border:0;background:none;font-size:15px;font-weight:700;color:#444;padding:10px 0;border-bottom:3px solid transparent}
.tabs button.on{color:var(--p);border-bottom-color:var(--p)}
.hdr{text-align:center;font-size:21px;font-weight:800;color:var(--p);margin:4px 0 12px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:18px}
.m{color:var(--m);font-size:14px}
input[type=time],input[type=number]{border:2px solid var(--line);background:#faf7ff;border-radius:12px;font-size:17px;font-weight:700;color:var(--t);padding:6px 8px;text-align:center}
input[type=number]{width:70px}
.big{font-size:30px;font-weight:800;color:var(--p);text-align:center;margin:10px 0 8px}
.big.okc{color:var(--blue)}.big.badc{color:var(--red)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--red);border-radius:6px;transition:width .3s}
.bar i.ok{background:var(--blue)}
.btn{width:100%;border:0;border-radius:999px;padding:16px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(90deg,#6a5cff,#a07cff)}
.btn.stop{background:#1fbf80}
.btn.ghost{background:#efe9fb;color:#6a4bd6}
.btn:disabled{background:#cfc6e4}
.card.wk{background:#fff7e0;border-left:9px solid #f5a623}
.card.wl{background:#eaf8ee;border-left:9px solid #2fb866}
.card.ex{background:#f3ebff;border-left:9px solid #8e5cf0}
.ttl{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.ttl i{font-style:normal;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;background:#fff}
.btn.wk{background:linear-gradient(90deg,#f5a623,#ffc857)}
.btn.wl{background:linear-gradient(90deg,#2fb866,#66d98f)}
.btn.ex{background:linear-gradient(90deg,#7c4dff,#a07cff)}
.btn.stop{background:#3f3d56}
.btn:disabled{background:#cfc6e4}
.edit{margin-top:10px;text-align:center}
.link{background:none;border:0;color:var(--m);font-size:14px;text-decoration:underline;padding:8px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;color:#fff;font-size:13px;font-weight:700}
.badge.ok{background:var(--blue)}.badge.bad{background:var(--red)}
.st{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--m);margin-top:14px}
.st b{color:var(--p);font-size:15px}
.msg{white-space:pre-line;font-size:14px;color:#6a4bd6;background:#f4eeff;border-radius:12px;padding:10px 12px;margin-top:12px;text-align:center;line-height:1.5}
.pend .row.two{margin-top:12px}
.pend .row.two .btn{flex:1;padding:14px;font-size:18px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{width:52px;height:52px;border:2px solid var(--line);background:#fff;border-radius:16px;font-size:22px;font-weight:700}
.nav .c{text-align:center}
.mo{font-size:22px;font-weight:800}
.sub{font-size:13px;color:var(--m);margin-top:2px}
.detail{min-height:44px;text-align:center;font-size:15px;padding:6px 0;line-height:1.6}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--m);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
svg{width:100%;height:auto;display:block}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:13px;color:var(--m);padding:4px 0}
.cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px}
.cell.today{outline:2px solid var(--p)}
.cell .ht{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
.cell .dn{position:relative;z-index:1;font-weight:700;font-size:15px}
.chipb{border:none;background:#f1ebf8;color:#8d4dff;font-weight:800;padding:12px 22px;border-radius:999px;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px}
.pop{background:#fff;border-radius:26px;padding:26px 22px 22px;max-width:340px;width:100%;text-align:center}
.pe{font-size:56px}
.pt{white-space:pre-line;max-height:55vh;overflow:auto;font-size:19px;font-weight:700;line-height:1.55;margin:12px 0 20px;word-break:keep-all}
</style>
</head>

function nextMsg(kind){
  const arr=POOL[kind];let c=S.cyc[kind];
  if(!c||!c.length||c.some(t=>t!=='B'&&t>=arr.length)){
    c=arr.map((_,i)=>i);c.push('B');
    for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}
  }
  const t=c.pop();S.cyc[kind]=c;
  return t;
}

function addDays(k,n){const a=k.split('-').map(Number);return keyOf(new Date(a[0],a[1]-1,a[2]+n,12))}
function pick(name,arr){
  let b=S.bag[name];
  if(!b||!b.length||b.some(i=>i>=arr.length)){
    b=arr.map((_,i)=>i);
    for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}
  }
  const i=b.pop();S.bag[name]=b;return arr[i];
}

/* 성공 판정 */
function okOn(kind,k,noLive){
  const r=S[kind][k];
  if(kind==='wake')return !!r&&r.t<=r.goal;
  let sec=r?r.sec:0;const g=r?r.goal:S.goal[kind];
  const run=S.run[kind];if(!noLive&&run&&run.day===k)sec+=(Date.now()-run.start)/1000;
  return g>0&&sec>=g*60;
}
function streakInfo(kind){
  const today=keyOf(new Date());
  let c=0,k=okOn(kind,today)?today:addDays(today,-1);
  while(okOn(kind,k)){c++;k=addDays(k,-1)}
  const list=Object.keys(S[kind]).filter(x=>okOn(kind,x)).sort();
  let best=0,run=0,prev=null;
  for(const x of list){run=(prev&&addDays(prev,1)===x)?run+1:1;best=Math.max(best,run);prev=x}
  return {cur:c,best:Math.max(best,c)};
}
function monthOk(kind){
  const t=new Date();let c=0;
  for(let d=1;d<=t.getDate();d++)if(okOn(kind,t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(d)))c++;
  return c;
}

function confetti(n){
  let c=document.getElementById('cf');
  if(!c){c=document.createElement('canvas');c.id='cf';c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1000';document.body.appendChild(c)}
  const dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
  c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext('2d');
  const cols=['#ff6b9d','#ffd93d','#6bcb77','#4d96ff','#9b5de5','#ff9f45'];
  const P=[];
  for(let i=0;i<n;i++)P.push({x:W/2+(Math.random()-.5)*60,y:H*.45,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
  let f=0;
  (function loop(){
    x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    f++;
    if(f<200)requestAnimationFrame(loop);else x.clearRect(0,0,W,H);
  })();
}
function popup(text,ok,big,bonus,after,letter){

  const e=document.createElement('div');e.className='pe';e.textContent=ok?(letter?'💌':bonus?'🎁':big?'🏆':'🎉'):'😴';
  const t=document.createElement('div');t.className='pt';t.textContent=text;
  const b=document.createElement('button');b.className='btn';b.textContent='확인';b.onclick=()=>{o.remove();if(after)popup(after,true,false,false,null,true)};
  p.append(e,t,b);o.appendChild(p);document.body.appendChild(o);
  if(ok){confetti(big?230:130);if(big)setTimeout(()=>confetti(170),600);if(bonus)setTimeout(()=>confetti(200),1200)}
}

function celebrateText(kind){

  const t=nextMsg(kind);
  const cap=()=>{if(!S.bonusSeen){S.bonusSeen=true;return ' (캡쳐해서 아빠에게)'}return ''};
  const n=okCounts(),bs=S.big9Base||{wake:0,walk:0,ex:0};
  if(n.wake-bs.wake>=3&&n.walk-bs.walk>=3&&n.ex-bs.ex>=3){
    S.big9Base=n;
    return {text:pick('big9',BIG9),big:true,bonus:true,after:LETTER9};

}

    S.run[kind]={start:Date.now(),day:keyOf(new Date())};
  }
  save();renderMain();
}
function pendSave(kind){
  const pd=S.pending[kind];if(!pd)return;
  const v=Math.max(0,parseFloat(document.getElementById('pm-'+kind).value)||0);
  const rec=S[kind][pd.day]||(S[kind][pd.day]={sec:0,goal:S.goal[kind]});
  rec.sec+=v*60;S.pending[kind]=null;save();renderMain();checkGoal(kind);
}
function pendDrop(kind){S.pending[kind]=null;save();renderMain()}
let editKind=null;
function openEdit(kind){editKind=kind;renderMain()}
function closeEdit(){editKind=null;renderMain()}
function saveEdit(kind){
  const v=Math.max(0,parseFloat(document.getElementById('em-'+kind).value)||0);
  const k=keyOf(new Date());
  const rec=S[kind][k]||(S[kind][k]={sec:0,goal:S.goal[kind]});
  rec.sec=v*60;editKind=null;save();renderMain();checkGoal(kind);
}
function setGoal(kind,v){
  v=Math.max(0,parseInt(v)||0);S.goal[kind]=v;
  const rec=S[kind][keyOf(new Date())];if(rec)rec.goal=v;
  save();renderMain();
}
function checkGoal(kind){
  const k=keyOf(new Date());
  if(S.cel[kind][k]||!okOn(kind,k,true))return;
  S.cel[kind][k]=true;
  const c=celebrateText(kind);
  S.msg[kind][k]=c.text;save();renderMain();popup(c.text,true,c.big,c.bonus,c.after);
}

/* ================= 메인 ================= */
function statLine(kind){
  const s=streakInfo(kind);
  return `<div class="st"><span>🔥 현재 연속 <b>${s.cur}</b>일</span><span>🏆 최고 연속 <b>${s.best}</b>일</span><span>이번 달 성공 <b>${monthOk(kind)}</b>일</span></div>`;
}
function msgLine(kind){const m=S.msg[kind][keyOf(new Date())];return m?`<div class="msg">${m}</div>`:''}
function kindCard(kind){
  const run=S.run[kind],l=LABEL[kind],pd=S.pending[kind];
  let action;
  if(pd){
    const mins=Math.round(pd.sec/60);
    action=`<div class="pend"><div class="m" style="text-align:center;margin-bottom:10px">이번 ${l} 시간을 확인해 주세요<br>(시작 후 ${mins}분 지났어요)</div>
      <div class="row" style="justify-content:center"><input type="number" id="pm-${kind}" min="0" inputmode="decimal" value="${mins}"><span>분</span></div>
      <div class="row two"><button class="btn ghost" onclick="pendDrop('${kind}')">기록 안 함</button><button class="btn" onclick="pendSave('${kind}')">저장</button></div></div>`;
  }else{
    action=`<button class="btn ${run?'stop':TH[kind]}" onclick="toggle('${kind}')">${run?'⏸ '+l+' 종료':'▶ '+l+' 시작'}</button>`;
  }
  let edit='';
  if(!pd&&!run){
    if(editKind===kind){
      const cm=Math.round((S[kind][keyOf(new Date())]?S[kind][keyOf(new Date())].sec:0)/60);
      edit=`<div class="pend"><div class="m" style="text-align:center;margin:12px 0 8px">오늘 ${l} 총 시간 고치기</div>
        <div class="row" style="justify-content:center"><input type="number" id="em-${kind}" min="0" inputmode="decimal" value="${cm}"><span>분</span></div>
        <div class="row two"><button class="btn ghost" onclick="closeEdit()">취소</button><button class="btn ${TH[kind]}" onclick="saveEdit('${kind}')">저장</button></div></div>`;
    }else edit=`<div class="edit"><button class="link" onclick="openEdit('${kind}')">✏️ 오늘 시간 고치기</button></div>`;
  }
  return `<div class="card ${TH[kind]}">
    <div class="row"><div class="ttl"><i>${ICON[kind]}</i>${l}</div>
      <span class="m">오늘 목표 <input type="number" min="0" inputmode="numeric" value="${S.goal[kind]}" onchange="setGoal('${kind}',this.value)"> 분</span></div>
    <div style="margin-top:12px">${action}</div>
    <div class="big badc" id="t-${kind}">0분 00초</div>
    <div class="bar"><i id="b-${kind}"></i></div>
    ${edit}${statLine(kind)}${msgLine(kind)}
  </div>`;
}
function renderMain(){
  const k=keyOf(new Date()),w=S.wake[k];
  let wakeBody;
  if(w){
    const ok=w.t<=w.goal;
    wakeBody=`<div class="big ${ok?'okc':'badc'}">${fmt(w.t)}</div>
      <div style="text-align:center;margin-bottom:12px"><span class="badge ${ok?'ok':'bad'}">${ok?'일찍 일어남':'늦게 일어남'}</span></div>
      <button class="btn" disabled>기상 완료</button>`;
  }else{
    wakeBody=`<div class="big" style="color:#bbb">--:--</div>
      <button class="btn wk" onclick="wakePress()">☀️ 지금 일어났어요</button>`;
  }
  document.getElementById('view').innerHTML=
    `<div class="hdr">☀️ Busy Sunny</div><div class="card wk"><div class="row"><div class="ttl"><i>☀️</i>기상</div>
      <span class="m">목표 <input type="time" value="${S.wakeGoal}" onchange="setWakeGoal(this.value)"></span></div>
      ${wakeBody}${statLine('wake')}${msgLine('wake')}</div>`
    +kindCard('walk')+kindCard('ex');
  tick();
}
function tick(){
  checkGoal('walk');checkGoal('ex');
  if(tab!=='main')return;
  const k=keyOf(new Date());
  ['walk','ex'].forEach(kind=>{
    const t=document.getElementById('t-'+kind);if(!t)return;
    let sec=(S[kind][k]?S[kind][k].sec:0);
    const r=S.run[kind];if(r&&r.day===k)sec+=(Date.now()-r.start)/1000;
    t.textContent=Math.floor(sec/60)+'분 '+pad(Math.floor(sec%60))+'초';
    const g=S.goal[kind]*60,ok=g>0&&sec>=g;
    t.className='big '+(ok?'okc':'badc');
    const b=document.getElementById('b-'+kind);
    b.style.width=(g>0?Math.min(100,sec/g*100):0)+'%';
    b.className=ok?'ok':'';
  });
}
setInterval(tick,1000);

/* ================= 그래프 ================= */
function mv(d){cur.setMonth(cur.getMonth()+d);render()}
function renderGraph(kind){
  const y=cur.getFullYear(),mo=cur.getMonth(),n=new Date(y,mo+1,0).getDate();
  const todayK=keyOf(new Date());
  const days=[];
  for(let d=1;d<=n;d++){
    const k=y+'-'+pad(mo+1)+'-'+pad(d),r=S[kind][k];
    if(!r){days.push({d,k,none:true});continue}
    if(kind==='wake')days.push({d,k,v:r.t,g:r.goal,ok:r.t<=r.goal});
    else days.push({d,k,v:r.sec/60,g:r.goal,ok:r.goal>0?r.sec>=r.goal*60:null});
  }
  const rec=days.filter(x=>!x.none);
  let stat;
  if(kind==='wake'){
    stat=rec.length?`평균 ${fmt(Math.round(rec.reduce((a,x)=>a+x.v,0)/rec.length))} · 목표 달성 ${rec.filter(x=>x.ok).length}일`:'기록 없음';
  }else{
    const sum=Math.floor(rec.reduce((a,x)=>a+x.v,0));
    stat=`합계 ${sum.toLocaleString()}분 · 목표 달성 ${rec.filter(x=>x.ok).length}일`;
  }
  let ymin=0,ymax,ticks;
  if(kind==='wake'){ymin=300;ymax=840;ticks=[300,420,540,660,780,840]}
  else{
    const mx=Math.max(30,...rec.map(x=>Math.max(x.v,x.g||0)));
    const step=Math.max(10,Math.ceil(mx/4/10)*10);
    ymax=step*4;ticks=[0,step,step*2,step*3,step*4];
  }
  const W=360,H=330,L=38,R=6,T=40,B=26,pw=W-L-R,ph=H-T-B;
  const yy=v=>T+ph*(1-(Math.min(Math.max(v,ymin),ymax)-ymin)/(ymax-ymin));
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  ticks.forEach(t=>{
    s+=`<line x1="${L}" x2="${W-R}" y1="${yy(t)}" y2="${yy(t)}" stroke="#e9e2f5"/>`;
    s+=`<text x="${L-6}" y="${yy(t)+4}" font-size="11" fill="#777" text-anchor="end">${kind==='wake'?(t/60)+'시':t}</text>`;
  });
  const slot=pw/n,bw=slot*0.68;
  days.forEach((x,i)=>{
    const bx=L+slot*i+(slot-bw)/2;
    if(!x.none){
      const top=yy(x.v),base=T+ph;
      const col=x.ok===null?'#7c4dff':(x.ok?'#3b82f6':'#ef4444');
      s+=`<rect x="${bx}" y="${top}" width="${bw}" height="${Math.max(1,base-top)}" rx="2" fill="${col}"/>`;
      if(x.g>0)s+=`<line x1="${bx-1}" x2="${bx+bw+1}" y1="${yy(x.g)}" y2="${yy(x.g)}" stroke="#222" stroke-width="1.6" opacity=".55"/>`;
      const lab=kind==='wake'?Math.floor(x.v/60)+':'+pad(x.v%60):String(Math.floor(x.v));
      s+=`<text transform="translate(${bx+bw/2+3},${top-4}) rotate(-90)" font-size="8" fill="#555">${lab}</text>`;
    }
    const isT=x.k===todayK;
    s+=`<text x="${bx+bw/2}" y="${H-9}" font-size="8" text-anchor="middle" fill="${isT?'#7c4dff':'#777'}" font-weight="${isT?800:400}">${x.d}</text>`;
    s+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${ph+B}" fill="transparent" onclick="detail('${kind}',${i})"/>`;
  });
  s+='</svg>';
  window._days=days;
  document.getElementById('view').innerHTML=
    `<div class="card nav"><button onclick="mv(-1)">&lt;</button>
      <div class="c"><div class="mo">${y}년 ${mo+1}월</div><div class="sub">${LABEL[kind]} · ${stat}</div></div>
      <button onclick="mv(1)">&gt;</button></div>
     <div class="card">${s}
       <div class="detail" id="detail">막대를 누르면 자세히 보입니다</div>
       <div class="legend"><span style="--c:#3b82f6">목표 달성</span><span style="--c:#ef4444">목표 미달</span><span style="--c:#222">목표선</span></div></div>`;
}
function detail(kind,i){
  const x=window._days[i],el=document.getElementById('detail');
  const m=cur.getMonth()+1;
  if(x.none){el.textContent=`${m}월 ${x.d}일 · 기록 없음`;return}
  const badge=x.ok===null?'':`<span class="badge ${x.ok?'ok':'bad'}">${x.ok?'달성':'미달'}</span>`;
  if(kind==='wake')el.innerHTML=`${m}월 ${x.d}일 · 기상 <b>${fmt(x.v)}</b> (목표 ${fmt(x.g)}) ${badge}`;
  else el.innerHTML=`${m}월 ${x.d}일 · <b>${Math.floor(x.v)}분</b> (목표 ${x.g}분) ${badge}`;
}

/* ================= 달력 ================= */
const HEART='<svg class="ht" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.8 1.2 5.6 3.3 1.8-2.1 3.5-3.3 5.6-3.3 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z" fill="#ffc9dc"/></svg>';
function renderCal(){
  const y=cur.getFullYear(),mo=cur.getMonth(),n=new Date(y,mo+1,0).getDate(),first=new Date(y,mo,1).getDay();
  const todayK=keyOf(new Date());
  const cnt={all:0,wake:0,walk:0,ex:0};
  let cells='';
  for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=n;d++){
    const k=y+'-'+pad(mo+1)+'-'+pad(d);
    const a=okOn('wake',k),b=okOn('walk',k),c=okOn('ex',k);
    if(a)cnt.wake++;if(b)cnt.walk++;if(c)cnt.ex++;
    const all=a&&b&&c;if(all)cnt.all++;
    cells+=`<div class="cell ${k===todayK?'today':''}" onclick="calDetail('${k}')">${all?HEART:''}<span class="dn">${d}</span></div>`;
  }
  const dows=['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('');
  document.getElementById('view').innerHTML=
    `<div class="card nav"><button onclick="mv(-1)">&lt;</button>
      <div class="c"><div class="mo">${y}년 ${mo+1}월</div><div class="sub">💗 <b style="color:#e8709a">${cnt.all}</b>일 · 기상 ${cnt.wake} · 산책 ${cnt.walk} · 운동 ${cnt.ex}</div></div>
      <button onclick="mv(1)">&gt;</button></div>
     <div class="card"><div class="grid">${dows}${cells}</div>
      <div class="detail" id="detail">날짜를 누르면 자세히 보입니다<br><span class="m">💗 기상·산책·운동 3개 모두 성공한 날</span></div></div>`;
}
function calDetail(k){
  const a=k.split('-').map(Number),el=document.getElementById('detail');
  const w=S.wake[k],wk=S.walk[k],ex=S.ex[k];
  const mark=o=>o?'✅':'❌';
  const wt=w?fmt(w.t):'기록 없음';
  const wm=wk?Math.floor(wk.sec/60)+'분':'0분',em=ex?Math.floor(ex.sec/60)+'분':'0분';
  el.innerHTML=`${a[1]}월 ${a[2]}일<br>기상 ${wt} ${mark(okOn('wake',k))} · 산책 ${wm} ${mark(okOn('walk',k))} · 운동 ${em} ${mark(okOn('ex',k))}`;
}


/* ================= 설정 / 백업 ================= */
function renderSet(){
  document.getElementById('view').innerHTML=
   `<div class="card"><div class="ttl" style="font-size:20px">⚙️ 기록 보관</div>
    <div class="m" style="margin:10px 0 14px;line-height:1.6">휴대폰 브라우저의 사이트 데이터를 지우면 기록도 사라집니다. 가끔 백업 파일을 저장해 두세요.</div>
    <div class="row" style="justify-content:center;gap:12px">
      <button class="chipb" onclick="backupData()">기록 백업</button>
      <button class="chipb" onclick="restoreData()">기록 복구</button>
    </div></div>`;
}
function backupData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='busy_sunny_backup_'+keyOf(new Date())+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
function restoreData(){document.getElementById('restoreFile').click()}
document.getElementById('restoreFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      if(!p||typeof p!=='object'||!p.wake||!p.walk||!p.ex)throw 0;
      if(!confirm('현재 기록을 백업 파일의 기록으로 바꿉니다. 계속할까요?'))return;
      Object.assign(S,p);
      S.msg=S.msg||{wake:{},walk:{},ex:{}};S.cel=S.cel||{walk:{},ex:{}};S.bag=S.bag||{};S.cyc=S.cyc||{};
      S.run=S.run||{walk:null,ex:null};S.pending=S.pending||{walk:null,ex:null};
      save();render();alert('복구 완료!');
    }catch(err){alert('복구 실패: 파일 오류')}
    e.target.value='';
  };
  rd.readAsText(f);
});

drawTabs();render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
</body>
